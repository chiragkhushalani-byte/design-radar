<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Chirag · AI Design Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --bg2: #161719;
    --bg3: #1e2024;
    --bg4: #26282d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e9eb;
    --text2: #9a9ca3;
    --text3: #5c5e65;
    --accent: #d4a84b;
    --accent2: #e8c270;
    --accent-bg: rgba(212,168,75,0.08);
    --accent-border: rgba(212,168,75,0.2);
    --user-bubble: #1e2024;
    --agent-bubble: #161719;
    --green: #4caf82;
    --red: #e05c5c;
    --blue: #5b8dee;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 12px;
    --radius-sm: 7px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Layout ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
    padding: 0;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4a84b 0%, #8b5e1a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    flex-shrink: 0;
    position: relative;
  }

  .avatar::after {
    content: '';
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid var(--bg);
  }

  .header-info { flex: 1; }
  .header-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .header-sub {
    font-size: 12px;
    color: var(--text3);
    font-family: var(--mono);
    margin-top: 1px;
  }

  .header-badges {
    display: flex;
    gap: 6px;
  }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    color: var(--text2);
    background: var(--bg2);
    white-space: nowrap;
  }
  .badge.active {
    border-color: var(--accent-border);
    color: var(--accent);
    background: var(--accent-bg);
  }

  /* ── Mode Tabs ── */
  .mode-bar {
    display: flex;
    gap: 0;
    padding: 12px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .mode-tab {
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 16px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text3);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.03em;
  }
  .mode-tab:hover { color: var(--text2); }
  .mode-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    animation: fadeSlide 0.2s ease both;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 500;
    margin-top: 2px;
  }
  .msg-avatar.chirag {
    background: linear-gradient(135deg, #d4a84b 0%, #8b5e1a 100%);
    color: #fff;
  }
  .msg-avatar.user-av {
    background: var(--bg4);
    color: var(--text2);
    border: 1px solid var(--border2);
  }

  .msg-content { max-width: 78%; }

  .msg-sender {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    margin-bottom: 5px;
    letter-spacing: 0.04em;
  }
  .msg-row.user .msg-sender { text-align: right; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.chirag-bubble {
    background: var(--bg2);
    border-color: var(--border);
    border-top-left-radius: 3px;
  }
  .bubble.user-bubble {
    background: var(--bg3);
    border-color: var(--border2);
    border-top-right-radius: 3px;
  }

  /* ── Typing indicator ── */
  .typing-row { display: flex; gap: 12px; padding: 10px 0; }
  .typing-bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    border-top-left-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text3);
    animation: blink 1.2s ease infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* ── Quick prompts ── */
  .quick-prompts {
    padding: 0 24px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    flex-shrink: 0;
  }

  .qp {
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 11px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .qp:hover {
    border-color: var(--accent-border);
    color: var(--accent);
    background: var(--accent-bg);
  }

  /* ── Input area ── */
  .input-area {
    display: flex;
    gap: 10px;
    padding: 14px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    align-items: flex-end;
  }

  .input-wrap {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    display: flex;
    align-items: flex-end;
    padding: 10px 14px;
    gap: 8px;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent-border);
  }

  #msg-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
    resize: none;
    max-height: 140px;
    min-height: 22px;
    overflow-y: auto;
  }
  #msg-input::placeholder { color: var(--text3); }
  #msg-input::-webkit-scrollbar { width: 3px; }
  #msg-input::-webkit-scrollbar-thumb { background: var(--bg4); }

  .send-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0e0f11;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
    margin-bottom: 2px;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: default; }

  .send-btn svg { width: 16px; height: 16px; }

  /* ── Mode-specific tags in bubble ── */
  .review-tag, .pm-tag, .gen-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .review-tag { background: rgba(91,141,238,0.1); color: #5b8dee; border: 1px solid rgba(91,141,238,0.2); }
  .pm-tag { background: rgba(224,92,92,0.1); color: #e05c5c; border: 1px solid rgba(224,92,92,0.2); }
  .gen-tag { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    gap: 16px;
  }

  .empty-glyph {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4a84b 0%, #8b5e1a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 20px;
    color: #fff;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .empty-sub {
    font-size: 13px;
    color: var(--text3);
    max-width: 340px;
    line-height: 1.6;
  }

  /* ── Separator ── */
  .sep {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    padding: 6px 0 2px;
    letter-spacing: 0.04em;
  }

  /* ── Formatted response parts ── */
  .bubble ul { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: var(--accent2); font-weight: 500; }
  .bubble code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg4);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--text);
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
</style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="avatar">CK</div>
    <div class="header-info">
      <div class="header-name">Chirag Khushalani</div>
      <div class="header-sub">Lead – Product Design · Ventura Securities</div>
    </div>
    <div class="header-badges">
      <span class="badge active" id="mode-badge">chat</span>
      <span class="badge" id="status-badge">online</span>
    </div>
  </div>

  <!-- Mode Tabs -->
  <div class="mode-bar">
    <button class="mode-tab active" data-mode="chat" onclick="setMode('chat', this)">general</button>
    <button class="mode-tab" data-mode="review" onclick="setMode('review', this)">design review</button>
    <button class="mode-tab" data-mode="pm" onclick="setMode('pm', this)">pm triage</button>
  </div>

  <!-- Messages container -->
  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-glyph">CK</div>
      <div class="empty-title">Ask Chirag anything</div>
      <div class="empty-sub">Design decisions, PM request reviews, team guidance — I'll answer the way Chirag would.</div>
    </div>
  </div>

  <!-- Quick prompts -->
  <div class="quick-prompts" id="quick-prompts">
    <button class="qp" onclick="usePrompt(this.textContent)">what's your design philosophy?</button>
    <button class="qp" onclick="usePrompt(this.textContent)">review this PM request</button>
    <button class="qp" onclick="usePrompt(this.textContent)">how do you handle scope creep?</button>
    <button class="qp" onclick="usePrompt(this.textContent)">what makes a good fintech UX?</button>
    <button class="qp" onclick="usePrompt(this.textContent)">how should the team prioritise?</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msg-input" placeholder="Ask Chirag something..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8L8 3M8 3L13 8M8 3V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPTS = {
  chat: `You are an AI agent embodying Chirag Khushalani — Lead, Product Design at Ventura Securities, Mumbai. You have roughly a decade of product design experience across fintech, banking, and B2B platforms, including Axis Bank–Freecharge, Drip Capital, Oyster Living, and Isobar. You have an MBA background and studied at Deakin University, Melbourne.

You lead a 5-person design team: Manaar Jafri, Ojus Thool, Varun Kewalramani, and Tanushree Hanmattekar. Your team works across: Algo trading, Cash/Equity, Commodities, IPO, Mutual Funds, Wallet, COB, FD, and Bonds.

Your design philosophy:
- Clarity over cleverness. If something needs explanation, it's not designed well.
- Data-forward: for a financial product, trust is built through information density done well — not hiding numbers behind vague summaries.
- Hierarchy is everything. Users scan, not read. Every screen should have one primary action.
- Mobile-first, but don't dumb it down for desktop. Earn both.
- Systems thinking: design a component, think about the system it belongs to.
- Good UX is invisible. Bad UX is all you see.
- Business goals and user goals are usually the same thing — find where they overlap.
- Opinions from data, decisions from judgment.

Your communication style:
- Direct, no-fluff. You don't pad answers.
- You use examples and analogies from fintech readily.
- You'll push back — constructively — when you disagree. You don't just validate.
- You're encouraging to the team but set a high bar.
- You occasionally use Hinglish phrasing naturally (e.g. "yaar", "matlab", "dekho").
- You think out loud and show your reasoning, not just the conclusion.

Always respond as Chirag in first person. Be specific, opinionated, and useful. Keep answers concise unless detail is genuinely needed.`,

  review: `You are Chirag Khushalani reviewing a design — a screen, flow, spec, or concept — as Lead, Product Design at Ventura Securities with 10 years in fintech UX.

Your review framework:
1. **First impression** — what does a first-time user feel in the first 3 seconds?
2. **Hierarchy** — is there a clear primary action? Does the eye flow logically?
3. **Information clarity** — are data, labels, and states unambiguous? Any room for misreading?
4. **Edge cases** — what happens with 0 state, error state, loading state, long text?
5. **Consistency** — does this align with the design system / patterns already established?
6. **Mobile** — does this hold up on a small screen? Is touch target size respected?
7. **Business alignment** — does this design serve the metric we're optimizing for?
8. **One thing to fix first** — if they can only change one thing, what is it?

Your tone in reviews:
- Start with what's working — briefly, authentically. Not as a buffer, but genuine acknowledgment.
- Be specific about problems. "The button is confusing" is not feedback. "The CTA label 'Proceed' is ambiguous — proceed to what?" is feedback.
- Suggest, don't just critique. For every problem, offer a direction.
- You have a high bar but you're not harsh. The goal is a better design, not a demolished designer.
- Use Chirag's natural voice — direct, considered, occasionally Hinglish.

Respond as Chirag giving a real design review. Be structured and specific.`,

  pm: `You are Chirag Khushalani triaging a PM request as Lead, Product Design at Ventura Securities.

When a PM submits a request or describes a feature, your job is to:

1. **Understand the ask** — restate it in your own words to confirm alignment
2. **Flag ambiguity** — identify what's unclear, missing, or assumed
3. **Scope it** — break it into design tasks (flows, states, components, edge cases needed)
4. **Push back if needed** — call out if this is too vague to design, solving the wrong problem, or missing user research
5. **Estimate effort** — rough T-shirt sizing: Small (0.5-1 day), Medium (2-3 days), Large (3-5 days), XL (1+ week)
6. **Flag dependencies** — what does design need before starting? (data, API clarity, stakeholder sign-off, existing patterns to check)
7. **Recommend next step** — what should happen before a design brief is written?

Your PM communication style:
- You respect PMs but you're not a yes-machine. If a request is under-specified, say so clearly.
- You protect the team's bandwidth — you push back on scope creep and "small changes" that aren't.
- You ask about the user problem, not just the feature request.
- You speak in outcomes, not deliverables.
- You're collaborative — you frame concerns as "here's what we need to make this work" not "this is wrong".
- Occasionally Hinglish, always direct.

Respond as Chirag triaging the request. Be structured, opinionated, and useful.`
};

let currentMode = 'chat';
let conversationHistory = { chat: [], review: [], pm: [] };
let isLoading = false;

const quickPromptsByMode = {
  chat: [
    "what's your design philosophy?",
    "how do you handle scope creep?",
    "what makes a good fintech UX?",
    "how should the team prioritise?",
    "what's your biggest design lesson?"
  ],
  review: [
    "review a dashboard screen",
    "what to check in an onboarding flow?",
    "how do you review for mobile?",
    "critique a trading order placement UI",
    "what's the #1 thing designers miss?"
  ],
  pm: [
    "I need a new filter UI for the portfolio page",
    "add a notifications centre to the app",
    "we need to redesign the KYC flow ASAP",
    "can you quickly add a dark mode?",
    "user research says people don't find the search"
  ]
};

const modeTagMap = {
  chat: { label: 'chat', cls: 'gen-tag' },
  review: { label: 'design review', cls: 'review-tag' },
  pm: { label: 'pm triage', cls: 'pm-tag' }
};

function setMode(mode, el) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('mode-badge').textContent = mode === 'chat' ? 'chat' : mode === 'review' ? 'review' : 'pm';
  updateQuickPrompts();
  refreshMessages();
}

function updateQuickPrompts() {
  const container = document.getElementById('quick-prompts');
  container.innerHTML = quickPromptsByMode[currentMode]
    .map(p => '<button class="qp" onclick="usePrompt(this.textContent)">' + p + '</button>')
    .join('');
}

function refreshMessages() {
  const container = document.getElementById('messages');
  const history = conversationHistory[currentMode];
  if (history.length === 0) {
    container.innerHTML = '<div class="empty-state" id="empty-state"><div class="empty-glyph">CK</div><div class="empty-title">Ask Chirag anything</div><div class="empty-sub">' + getModeDesc() + '</div></div>';
    return;
  }
  container.innerHTML = '';
  const modeLabels = { chat: 'general', review: 'design review', pm: 'pm triage' };
  container.innerHTML += '<div class="sep">— ' + modeLabels[currentMode] + ' mode —</div>';
  history.forEach(msg => {
    if (msg.role === 'user') appendUserBubble(msg.content, false);
    else appendAgentBubble(msg.content, false);
  });
  container.scrollTop = container.scrollHeight;
}

function getModeDesc() {
  if (currentMode === 'review') return 'Describe a screen, flow, or paste a spec — I\'ll review it the way I would in a crit session.';
  if (currentMode === 'pm') return 'Drop a PM request here — I\'ll scope it, flag gaps, and tell you what we need before design starts.';
  return 'Design decisions, team guidance, fintech UX opinions — I\'ll answer the way Chirag would.';
}

function usePrompt(text) {
  document.getElementById('msg-input').value = text;
  autoResize(document.getElementById('msg-input'));
  document.getElementById('msg-input').focus();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function appendUserBubble(text, animate) {
  const container = document.getElementById('messages');
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'msg-row user' + (animate ? '' : ' no-anim');
  row.innerHTML =
    '<div class="msg-avatar user-av">you</div>' +
    '<div class="msg-content">' +
      '<div class="msg-sender">you</div>' +
      '<div class="bubble user-bubble">' + escapeHtml(text) + '</div>' +
    '</div>';
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function appendAgentBubble(text, animate) {
  const container = document.getElementById('messages');
  const tag = modeTagMap[currentMode];
  const row = document.createElement('div');
  row.className = 'msg-row' + (animate ? '' : ' no-anim');
  row.innerHTML =
    '<div class="msg-avatar chirag">CK</div>' +
    '<div class="msg-content">' +
      '<div class="msg-sender">chirag</div>' +
      '<div class="bubble chirag-bubble">' +
        '<span class="' + tag.cls + '">' + tag.label + '</span>\n' +
        formatText(text) +
      '</div>' +
    '</div>';
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-row';
  row.innerHTML =
    '<div class="msg-avatar chirag">CK</div>' +
    '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const row = document.getElementById('typing-row');
  if (row) row.remove();
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatText(text) {
  return escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^(\d+\.\s.+)$/gm, '<li>$1</li>')
    .replace(/^[-•]\s(.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/---/g, '<hr>');
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  autoResize(input);

  conversationHistory[currentMode].push({ role: 'user', content: text });
  appendUserBubble(text, true);
  showTyping();

  try {
    const messages = conversationHistory[currentMode].map(m => ({ role: m.role, content: m.content }));

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPTS[currentMode],
        messages: messages
      })
    });

    const data = await response.json();
    const reply = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : 'Sorry, something went wrong yaar. Try again.';

    removeTyping();
    conversationHistory[currentMode].push({ role: 'assistant', content: reply });
    appendAgentBubble(reply, true);

  } catch (err) {
    removeTyping();
    const errMsg = 'Connection issue — try again in a moment.';
    conversationHistory[currentMode].push({ role: 'assistant', content: errMsg });
    appendAgentBubble(errMsg, true);
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}
</script>
